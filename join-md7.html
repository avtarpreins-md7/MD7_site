<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD7 - بطاقة المشارك</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
  :root { --gold: #D4AF37; --black: #000; --gray: #222; }
  body { font-family: Tahoma, Arial, sans-serif; background: var(--black); color: #fff; margin: 0; padding: 20px; text-align: center; }
  .box { max-width: 500px; margin: auto; background: #111; padding: 25px; border-radius: 12px; border: 2px solid var(--gold); }
  input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid var(--gold); background: #000; color: #fff; border-radius: 8px; text-align: right; }
  .cta-btn { background: var(--gold); color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; min-height: 44px; }
  .card { width: 90mm; height: 55mm; background: linear-gradient(135deg, #000, #222); border: 2px solid var(--gold); border-radius: 10px; padding: 10px; margin: 20px auto; color: #fff; font-size: 12px; text-align: right; page-break-after: always; }
  .card h3 { color: var(--gold); margin: 5px 0; font-size: 16px; text-align: center; }
  .card .id { font-size: 20px; color: var(--gold); font-weight: bold; text-align: center; }
  .card .name { font-size: 14px; margin: 8px 0; }
  .card .footer { font-size: 10px; color: #aaa; margin-top: 10px; text-align: center; }
  .back { border-top: 1px dashed var(--gold); padding-top: 8px; margin-top: 8px; font-size: 10px; line-height: 1.5; }
  #qrcode { text-align: center; margin: 8px 0; display: flex; justify-content: center; }
  @media print { .no-print { display: none !important; } }
</style>
</head>
<body>

<div class="box" id="form-box">
  <h2>تسجيل المشاركة في MD7</h2>
  <p>سجل بياناتك لاستلام بطاقة المشارك الرقمية</p>
  <input id="name" placeholder="الاسم">
  <input id="lastname" placeholder="اللقب">
  <input id="phone" placeholder="رقم الهاتف">
  <input id="email" placeholder="البريد الالكتروني">
  <button class="cta-btn" onclick="submitForm()">ارسال طلب المشاركة</button>
  <p style="font-size:11px;color:#aaa">سيتم اصدار بطاقة رقمها يبدأ من 313</p>
</div>

<div id="card-print"></div>

<script>
let lastNumber = localStorage.getItem('md7_last_card') || 312; 

function submitForm(){
  const name = document.getElementById('name').value.trim();
  const lastname = document.getElementById('lastname').value.trim();
  if(!name || !lastname){ alert("من فضلك ادخل الاسم واللقب"); return; }
  
  lastNumber = parseInt(lastNumber) + 1;
  localStorage.setItem('md7_last_card', lastNumber);
  
  const d = {
    name: name + " " + lastname,
    id: "MD7-" + lastNumber,
    num: lastNumber,
    date: new Date().toLocaleDateString('ar-EG')
  };
  
  showCard(d);
  document.getElementById('form-box').classList.add('no-print');
}

function showCard(d){
  const cashNumber = "01033182019";
  const usdtBep20 = "0x16CC9c52E60a7E0F1eBdB94C53102Ff50f4bc67d";
  const btc = "bc1q6vk7zzs9956zzktnt0emhtcp7jn730zrt5k0kp";

  const paymentText = `MD7 GROUP\nالاسم: ${d.name}\nرقم الكرت: ${d.id}\n\nللدعم:\n1. USDT BEP20: ${usdtBep20}\n2. BTC: ${btc}\n3. كاش: ${cashNumber}\n\nامسح ب عدسة جوجل`;

  document.getElementById('card-print').innerHTML = `
  <div class="card">
    <h3>بطاقة مشارك MD7</h3>
    <p><b>رقم الكرت:</b></p>
    <p class="id">${d.id}</p>
    <p class="name"><b>الاسم:</b> ${d.name}</p>
    <p><b>ترتيبك:</b> رقم ${d.num}</p>
    <p><b>تاريخ الاصدار:</b> ${d.date}</p>
    <p class="footer">هذه البطاقة رمزية لدعم مشروع MD7</p>
    
    <div class="back">
      <b>طرق المساهمة:</b><br>
      1. <b>كاش / انستاباي</b>: ${cashNumber}<br>
      2. <b>USDT</b> شبكة BNB Smart Chain BEP20<br>
      3. <b>BTC</b> شبكة Bitcoin<br>
      <div id="qrcode"></div>
      <b>كيف تساهم؟</b><br>
      افتح "عدسة جوجل" > صور الكود > ارسل مساهمتك<br>
      <small style="color:#f44336">ملاحظة: هذا دعم تطوعي وليس بيع اسهم</small>
    </div>
  </div>
  <button onclick="window.print()" class="cta-btn no-print" style="margin-bottom:20px;">طباعة البطاقة</button>
  `;

  QRCode.toCanvas(document.getElementById('qrcode'), paymentText, {width: 120, color:{dark:'#D4AF37', light:'#000000'}});
  document.getElementById('card-print').scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
