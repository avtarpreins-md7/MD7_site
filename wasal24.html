    <div class="products-grid">
  
  <!-- منتج 1: بن البرنس -->
  <div class="product-card">
    <img src="images/ban-elprins.jpg" alt="بن البرنس">
    <h2>بن البرنس</h2>
    <p>السعر: <span class="price">126</span> جنيه / الكيس</p>
    
    <div class="calc-box">
      <label>العدد:</label>
      <input type="number" class="qty" value="1" min="1" oninput="calcTotal(this)">
      <label>طريقة الدفع:</label>
      <select class="payment" onchange="calcTotal(this)">
        <option value="0">كاش فوري - 0ج</option>
        <option value="2">تحصيل 3 أيام - +2ج</option>
        <option value="5">تحصيل 5 أيام - +5ج</option>
      </select>
      <h3>الاجمالي: <span class="total">126</span> جنيه</h3>
    </div>
    <button class="btn-gold" onclick="checkout(this, 'بن البرنس')">اطلب الآن</button>
  </div>

  <!-- منتج 2: مثال -->

    <div class="calc-box">
      <label>العدد كيلو:</label>

        <option value="0">كاش فوري - 0ج</option>
        <option value="2">تحصيل 3 أيام - +2ج</option>
        <option value="5">تحصيل 5 أيام - +5ج</option>
      </select>
      <h3>الاجمالي: <span class="total">45</span> جنيه</h3>
    </div>
    <button class="btn-gold" onclick="checkout(this, 'رز مصري')">اطلب الآن</button>
  </div>

</div>
