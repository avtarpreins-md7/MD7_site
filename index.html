<style>
  :root {
    --gold: #D4AF37;
    --silver: #C0C0C0;
    --black: #050505;
    --dark-gray: #121212;
    --card-bg: #1a1a1a;
    --gold-glow: rgba(212, 175, 55, 0.3);
  }

    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--black);
    color: #fff;
    overflow-x: hidden;
    direction: rtl;
  }

  /* الزرار العائم الجديد */
  #join-fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, var(--gold), #B8860B);
    color: #000;
    padding: 14px 25px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 900;
    z-index: 9999;
    box-shadow: 0 0 25px rgba(212,175,55,0.6);
    font-size: 15px;
    transition: 0.3s;
  }
  #join-fab:hover { transform: scale(1.05); }

  /* الهيدر + اللوجو الجديد MD */
  header { background: #000; border-bottom: 2px solid var(--gold); padding: 15px 30px; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; z-index: 1000; }
  .brand-logo { display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 900; cursor: pointer; text-decoration: none; }
  .logo-M { color: var(--gold); text-shadow: 0 0 20px var(--gold); }
  .logo-D { color: var(--silver); text-shadow: 0 0 20px var(--silver); }
  .logo-G { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
  .logo-R { color: #0000ff; text-shadow: 0 0 10px #0000ff; }
  .logo-O { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
  .logo-U { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
  .logo-P { color: #ffa500; text-shadow: 0 0 10px #ffa500; }
  .group-text { font-size: 16px; letter-spacing: 3px; }

  nav { display: flex; gap: 10px; flex-wrap: wrap; }
  nav button { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.3s; }
  nav button:hover, nav button.active { background: var(--gold); color: #000; font-weight: bold; }
  .view-section { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
  .view-section.active { display: block; }

  /* تعديل الدواير - اصغر + واخده عرض الشاشة */
  .solar-system-container { position: relative; width: 100%; height: 85vh; display: flex; justify-content: center; align-items: center; overflow: visible; }
  .center-sun-moon { width: 110px; height: 110px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: absolute; z-index: 10; cursor: pointer; transition: all 0.5s ease; text-align: center; }
  .sun-mode { background: radial-gradient(circle, #fff7ad 0%, #ffd700 50%, #ff8c00 100%); box-shadow: 0 0 50px #ff8c00, 0 0 100px #ffd700; color: #000; }
  .moon-mode { background: radial-gradient(circle, #ffffff 0%, #dcdcdc 50%, #708090 100%); box-shadow: 0 0 40px rgba(255, 255, 255, 0.8), 0 0 80px rgba(112, 128, 144, 0.6); color: #000; }
  .orbit-ring { position: absolute; width: 90vw; max-width: 700px; height: 90vw; max-height: 700px; border: 1px dashed rgba(212, 175, 55, 0.3); border-radius: 50%; animation: rotateOrbit 35s linear infinite; }
  @keyframes rotateOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .planet { position: absolute; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 11px; cursor: pointer; box-shadow: 0 0 15px currentColor; animation: pulsePlanet 2s infinite alternate; transition: transform 0.3s; text-align: center; line-height: 1.2; }
  .planet:hover { transform: scale(1.2); z-index: 20; }
  @keyframes pulsePlanet { 0% { transform: scale(0.95); } 100% { transform: scale(1.08); } }
  .planet-1 { top: -27px; left: calc(50% - 27px); background: #ff4757; color: #fff; }
  .planet-2 { top: 15%; right: -27px; background: #2ed573; color: #fff; }
